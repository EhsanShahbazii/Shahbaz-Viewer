<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Mesh Glows -->
    <radialGradient id="meshCyan" cx="20%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGold" cx="80%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="shahbazGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="falconWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bannerBg)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect width="1280" height="640" fill="url(#meshCyan)" />
  <rect width="1280" height="640" fill="url(#meshGold)" />

  <!-- Border Frame -->
  <rect x="12" y="12" width="1256" height="616" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- LEFT / CENTER HERO: SHAHBAZ LOGO & TITLES -->
  <g transform="translate(80, 80)">
    <!-- Falcon Icon Emblem -->
    <g transform="translate(0, 10)">
      <rect width="90" height="90" rx="22" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" filter="url(#glow)" />
      <!-- Falcon Wings inside small emblem -->
      <path d="M45 42 L24 24 L10 32 L22 41 L36 45 Z" fill="url(#falconWingGrad)" />
      <path d="M45 42 L66 24 L80 32 L68 41 L54 45 Z" fill="url(#falconWingGrad)" />
      <path d="M45 36 L52 48 L48 62 L45 66 L42 62 L38 48 Z" fill="#38bdf8" />
      <polygon points="45,18 48,26 45,28 42,26" fill="url(#shahbazGrad)" />
      <polygon points="45,24 50,30 47,37 43,37 40,30" fill="#e0f2fe" />
      <polygon points="45,39 43,34 47,34" fill="url(#shahbazGrad)" />
      <circle cx="45" cy="74" r="2.5" fill="#fbbf24" />
    </g>

    <!-- Version Badge & Status -->
    <g transform="translate(110, 15)">
      <rect width="130" height="26" rx="13" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="124" cy="28" r="4" fill="#38bdf8" />
      <text x="136" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">v1.0.0 RELEASE</text>
    </g>

    <!-- Primary Title -->
    <text x="110" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">
