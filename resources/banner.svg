    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      The Majestic SQLite Studio &amp; Visualizer for VS Code &amp; Cursor
    </text>

    <text x="0" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      Inspired by the Royal Falcon of Cyrus the Great • Built for Speed, Elegance &amp; Precision
    </text>

    <!-- Core Feature Badges Grid -->
    <g transform="translate(0, 215)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect width="260" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#38bdf8" />
        <text x="35" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ 60 FPS Virtualized Grid</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(275, 0)">
        <rect width="260" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#a855f7" />
        <text x="35" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🗺️ Interactive ER Diagram</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 52)">
        <rect width="260" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#10b981" />
        <text x="35" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📊 10+ Visual Chart Types</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(275, 52)">
        <rect width="260" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#f59e0b" />
        <text x="35" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">💻 SQL Studio &amp; Plan Advisor</text>
      </g>

      <!-- Feature 5 -->
      <g transform="translate(0, 104)">
        <rect width="260" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#ec4899" />
        <text x="35" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🪄 CSV / JSON Import Wizard</text>
      </g>

      <!-- Feature 6 -->
      <g transform="translate(275, 104)">
        <rect width="260" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="20" cy="21" r="5" fill="#06b6d4" />
        <text x="35" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🎲 Smart Mock Generator</text>
      </g>
    </g>

    <!-- Author & Footer Info -->
    <g transform="translate(0, 410)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">
