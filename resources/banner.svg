      <text x="245" y="112" font-family="monospace" font-size="11" fill="#fbbf24">4.92</text>
      <text x="330" y="112" font-family="monospace" font-size="11" fill="#10b981">active</text>
      <text x="420" y="112" font-family="monospace" font-size="11" fill="#38bdf8">true</text>

      <!-- Row 4 -->
      <line x1="0" y1="122" x2="490" y2="122" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="142" font-family="monospace" font-size="11" fill="#94a3b8">4</text>
      <text x="60" y="142" font-family="monospace" font-size="11" fill="#e2e8f0">sarah_k</text>
      <rect x="160" y="128" width="55" height="18" rx="3" fill="#334155" />
