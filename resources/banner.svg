      <text x="245" y="82" font-family="monospace" font-size="11" fill="#fbbf24">4.85</text>
      <text x="330" y="82" font-family="monospace" font-size="11" fill="#10b981">active</text>
      <text x="420" y="82" font-family="monospace" font-size="11" fill="#38bdf8">true</text>

      <!-- Row 3 -->
      <line x1="0" y1="92" x2="490" y2="92" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="112" font-family="monospace" font-size="11" fill="#94a3b8">3</text>
      <text x="60" y="112" font-family="monospace" font-size="11" fill="#e2e8f0">cyrus_g</text>
      <rect x="160" y="98" width="55" height="18" rx="3" fill="#f59e0b" fill-opacity="0.2" />
