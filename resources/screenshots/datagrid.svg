      <text x="120" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">Sum: 19.37</text>
      <text x="220" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8">Avg: 4.84</text>
