<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="8" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <!-- Top Header -->
