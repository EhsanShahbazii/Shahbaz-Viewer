    <text x="445" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24">4.92</text>
    <text x="525" y="22" font-family="monospace" font-size="11" fill="#10b981">active</text>
    <text x="625" y="22" font-family="monospace" font-size="11" fill="#38bdf8">1</text>
    <text x="700" y="22" font-family="monospace" font-size="10" fill="#a855f7">{role: "ops"}</text>
  </g>

  <!-- Row 4 -->
  <g transform="translate(220, 218)">
    <rect width="780" height="34" fill="#1c1c20" stroke="#27272a" stroke-width="0.5"/>
    <text x="15" y="22" font-family="monospace" font-size="11" fill="#a1a1aa">4</text>
    <text x="75" y="22" font-family="monospace" font-size="11" fill="#f4f4f5">sarah_k</text>
    <text x="190" y="22" font-family="monospace" font-size="11" fill="#93c5fd">sarah@domain.com</text>
    <rect x="355" y="7" width="55" height="20" rx="3" fill="#3f3f46"/>
    <text x="365" y="21" font-family="monospace" font-size="10" fill="#cbd5e1">USER</text>
