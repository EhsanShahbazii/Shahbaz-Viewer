  <rect x="8" y="85" width="204" height="28" rx="4" fill="#27272a"/>
  <text x="28" y="103" font-family="monospace" font-size="12" font-weight="600" fill="#38bdf8">users (52)</text>
  <text x="28" y="133" font-family="monospace" font-size="12" fill="#a1a1aa">customers (150)</text>
  <text x="28" y="163" font-family="monospace" font-size="12" fill="#a1a1aa">orders (500)</text>
  <text x="28" y="193" font-family="monospace" font-size="12" fill="#a1a1aa">order_items (1,420)</text>
  <text x="28" y="223" font-family="monospace" font-size="12" fill="#a1a1aa">products (85)</text>
  <text x="28" y="253" font-family="monospace" font-size="12" fill="#a1a1aa">categories (12)</text>
  <text x="28" y="283" font-family="monospace" font-size="12" fill="#a1a1aa">reviews (411)</text>

