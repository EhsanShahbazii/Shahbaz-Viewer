    <text x="445" y="22" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24">4.85</text>
    <text x="525" y="22" font-family="monospace" font-size="11" fill="#10b981">active</text>
    <text x="625" y="22" font-family="monospace" font-size="11" fill="#38bdf8">1</text>
    <text x="700" y="22" font-family="monospace" font-size="10" fill="#a855f7">{lang: "en"}</text>
  </g>

