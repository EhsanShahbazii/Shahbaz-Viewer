<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="8" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <!-- Header -->
  <rect width="1000" height="42" fill="#27272a"/>
  <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Shahbaz SQL Studio — Scratchpad &amp; EXPLAIN Advisor</text>
  
  <g transform="translate(720, 8)">
    <rect width="90" height="26" rx="4" fill="#0284c7"/>
    <text x="16" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">▶ Run (F5)</text>
    <rect x="100" width="80" height="26" rx="4" fill="#27272a" stroke="#3f3f46"/>
    <text x="115" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#f4f4f5">Format</text>
    <rect x="190" width="80" height="26" rx="4" fill="#27272a" stroke="#3f3f46"/>
    <text x="205" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#f4f4f5">History</text>
  </g>

  <!-- Monaco Editor Area -->
  <rect x="20" y="55" width="960" height="150" rx="6" fill="#121214" stroke="#27272a"/>
  <!-- Line Numbers -->
  <text x="35" y="80" font-family="monospace" font-size="12" fill="#52525b">1</text>
  <text x="35" y="105" font-family="monospace" font-size="12" fill="#52525b">2</text>
  <text x="35" y="130" font-family="monospace" font-size="12" fill="#52525b">3</text>
  <text x="35" y="155" font-family="monospace" font-size="12" fill="#52525b">4</text>
  <text x="35" y="180" font-family="monospace" font-size="12" fill="#52525b">5</text>

  <!-- Query Text -->
  <text x="65" y="80" font-family="monospace" font-size="13" fill="#38bdf8">SELECT <tspan fill="#f4f4f5">u.id, u.username, u.role, COUNT(o.id) AS total_orders, SUM(o.total_amount) AS spent</tspan></text>
  <text x="65" y="105" font-family="monospace" font-size="13" fill="#38bdf8">FROM <tspan fill="#f4f4f5">users u</tspan></text>
  <text x="65" y="130" font-family="monospace" font-size="13" fill="#38bdf8">LEFT JOIN <tspan fill="#f4f4f5">orders o ON o.customer_id = u.id</tspan></text>
  <text x="65" y="155" font-family="monospace" font-size="13" fill="#38bdf8">WHERE <tspan fill="#f4f4f5">u.status = </tspan><tspan fill="#a855f7">active</tspan><tspan fill="#38bdf8"> AND </tspan><tspan fill="#f4f4f5">u.rating &gt;= 4.5</tspan></text>
  <text x="65" y="180" font-family="monospace" font-size="13" fill="#38bdf8">GROUP BY <tspan fill="#f4f4f5">u.id ORDER BY spent DESC LIMIT 100;</tspan></text>

  <!-- Output Area Tabs -->
  <rect x="20" y="215" width="960" height="30" fill="#212124" stroke="#27272a"/>
  <rect x="25" y="218" width="130" height="24" rx="3" fill="#0284c7"/>
  <text x="38" y="234" font-family="system-ui" font-size="11" font-weight="600" fill="#ffffff">Results (52 rows)</text>
  <text x="180" y="234" font-family="system-ui" font-size="11" fill="#a1a1aa">EXPLAIN Plan</text>
  <text x="300" y="234" font-family="system-ui" font-size="11" fill="#a1a1aa">Advisory Tips (0 warnings)</text>
  <text x="860" y="234" font-family="monospace" font-size="11" fill="#10b981">⚡ 1.68 ms</text>

  <!-- Results Table Area -->
  <rect x="20" y="245" width="960" height="295" fill="#18181b" stroke="#27272a"/>
  <!-- Table Header -->
  <rect x="20" y="245" width="960" height="30" fill="#27272a"/>
  <text x="40" y="265" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">id</text>
  <text x="120" y="265" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">username</text>
  <text x="260" y="265" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">role</text>
  <text x="400" y="265" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">total_orders</text>
  <text x="560" y="265" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">spent ($)</text>

  <!-- Row 1 -->
  <text x="40" y="305" font-family="monospace" font-size="11" fill="#a1a1aa">1</text>
  <text x="120" y="305" font-family="monospace" font-size="11" fill="#f4f4f5">ehsan_s</text>
  <text x="260" y="305" font-family="monospace" font-size="11" fill="#38bdf8">ADMIN</text>
  <text x="400" y="305" font-family="monospace" font-size="11" fill="#fbbf24">34</text>
  <text x="560" y="305" font-family="monospace" font-size="11" fill="#10b981">142,850.00</text>

  <!-- Row 2 -->
  <text x="40" y="340" font-family="monospace" font-size="11" fill="#a1a1aa">3</text>
  <text x="120" y="340" font-family="monospace" font-size="11" fill="#f4f4f5">cyrus_g</text>
  <text x="260" y="340" font-family="monospace" font-size="11" fill="#fbbf24">AGENT</text>
  <text x="400" y="340" font-family="monospace" font-size="11" fill="#fbbf24">29</text>
  <text x="560" y="340" font-family="monospace" font-size="11" fill="#10b981">98,420.50</text>

  <!-- Row 3 -->
  <text x="40" y="375" font-family="monospace" font-size="11" fill="#a1a1aa">2</text>
  <text x="120" y="375" font-family="monospace" font-size="11" fill="#f4f4f5">alex_v</text>
  <text x="260" y="375" font-family="monospace" font-size="11" fill="#a1a1aa">USER</text>
  <text x="400" y="375" font-family="monospace" font-size="11" fill="#fbbf24">18</text>
  <text x="560" y="375" font-family="monospace" font-size="11" fill="#10b981">64,190.00</text>
</svg>