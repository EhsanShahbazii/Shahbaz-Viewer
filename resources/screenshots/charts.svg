<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <rect width="1000" height="560" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>
  <!-- Top bar -->
  <rect width="1000" height="42" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="25" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Shahbaz Visual Analytics — Quick Charts &amp; Aggregations</text>
  
  <g transform="translate(700, 8)">
    <rect width="280" height="26" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Save Config</text>
    <text x="100" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc">Export PNG</text>
    <text x="190" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc">Export SVG</text>
  </g>

  <!-- Left: Bar Chart -->
  <g transform="translate(40, 70)">
    <rect width="440" height="440" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Monthly Revenue by Tier ($k)</text>
    
    <!-- Y-axis -->
    <line x1="50" y1="60" x2="50" y2="380" stroke="#334155"/>
    <text x="20" y="70" font-family="monospace" font-size="10" fill="#64748b">100k</text>
    <text x="25" y="145" font-family="monospace" font-size="10" fill="#64748b">75k</text>
    <text x="25" y="220" font-family="monospace" font-size="10" fill="#64748b">50k</text>
    <text x="25" y="295" font-family="monospace" font-size="10" fill="#64748b">25k</text>
    <text x="35" y="380" font-family="monospace" font-size="10" fill="#64748b">0</text>
    
    <!-- Bars -->
    <rect x="75" y="210" width="45" height="170" rx="3" fill="#0284c7"/>
    <text x="83" y="405" font-family="monospace" font-size="10" fill="#94a3b8">Jan</text>
    
    <rect x="135" y="170" width="45" height="210" rx="3" fill="#38bdf8"/>
    <text x="143" y="405" font-family="monospace" font-size="10" fill="#94a3b8">Feb</text>

    <rect x="195" y="130" width="45" height="250" rx="3" fill="#0ea5e9"/>
    <text x="203" y="405" font-family="monospace" font-size="10" fill="#94a3b8">Mar</text>

    <rect x="255" y="100" width="45" height="280" rx="3" fill="#10b981"/>
    <text x="263" y="405" font-family="monospace" font-size="10" fill="#94a3b8">Apr</text>

    <rect x="315" y="75" width="45" height="305" rx="3" fill="#fbbf24"/>
    <text x="323" y="405" font-family="monospace" font-size="10" fill="#94a3b8">May</text>

    <rect x="375" y="60" width="45" height="320" rx="3" fill="#ec4899"/>
    <text x="383" y="405" font-family="monospace" font-size="10" fill="#94a3b8">Jun</text>
  </g>

  <!-- Right: Pie / Donut Breakdown & Stats -->
  <g transform="translate(520, 70)">
    <rect width="440" height="440" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">User Role &amp; Segment Distribution</text>
    
    <!-- Donut Circle simulation -->
    <circle cx="220" cy="200" r="110" fill="none" stroke="#0284c7" stroke-width="45" stroke-dasharray="280 400"/>
    <circle cx="220" cy="200" r="110" fill="none" stroke="#10b981" stroke-width="45" stroke-dasharray="190 400" stroke-dashoffset="-280"/>
    <circle cx="220" cy="200" r="110" fill="none" stroke="#fbbf24" stroke-width="45" stroke-dasharray="120 400" stroke-dashoffset="-470"/>
    <circle cx="220" cy="200" r="110" fill="none" stroke="#ec4899" stroke-width="45" stroke-dasharray="100 400" stroke-dashoffset="-590"/>
    
    <text x="180" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">TOTAL</text>
    <text x="175" y="215" font-family="monospace" font-size="18" font-weight="800" fill="#38bdf8">1,420</text>

    <!-- Legend -->
    <g transform="translate(60, 360)">
      <circle cx="10" cy="10" r="6" fill="#0284c7"/>
      <text x="25" y="14" font-family="system-ui" font-size="11" fill="#e2e8f0">Pro Subscribers (41%)</text>
      
      <circle cx="200" cy="10" r="6" fill="#10b981"/>
      <text x="215" y="14" font-family="system-ui" font-size="11" fill="#e2e8f0">Enterprise (28%)</text>

      <circle cx="10" cy="35" r="6" fill="#fbbf24"/>
      <text x="25" y="39" font-family="system-ui" font-size="11" fill="#e2e8f0">Standard (18%)</text>
      
      <circle cx="200" cy="35" r="6" fill="#ec4899"/>
      <text x="215" y="39" font-family="system-ui" font-size="11" fill="#e2e8f0">Free Tier (13%)</text>
    </g>
  </g>
</svg>